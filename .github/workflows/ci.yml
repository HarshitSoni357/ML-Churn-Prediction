name: Customer Inactivity ML CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test API and temporal logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Verify test fixture exists
        run: |
          test -f tests/fixtures/sample_features.json
          test -f artifacts/deployment/random_forest_v1.joblib
          test -f artifacts/deployment/model_metadata.json

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Run temporal boundary tests
        run: >
          python -m pytest tests/test_temporal_boundaries.py -v
          -k "not generated_dataset_invariants_when_available"

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t customer-inactivity-api:${{ github.sha }} .
